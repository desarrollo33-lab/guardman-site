name: Sync & Deploy Site

on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch:

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync from Admin API
        run: node scripts/sync-from-admin.mjs
        env:
          NODE_ENV: production

      - name: Validate CMS data
        run: node scripts/validate-cms.mjs
        continue-on-error: true

      - name: Build Astro Site
        run: npm run build

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "❌ Missing GitHub secret: CF_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "❌ Missing GitHub secret: CF_ACCOUNT_ID"
            exit 1
          fi

      - name: Install Wrangler v4
        run: npm i -g wrangler@4.83.0

      - name: Verify Wrangler
        run: wrangler --version

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy dist --project-name=guardman-site-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Health Check
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://guardman-site-v2.pages.dev/ || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Health check returned $STATUS (may need more time)"
          else
            echo "✅ Health check passed - HTTP $STATUS"
          fi

      - name: Notify success
        if: success()
        run: echo "✅ Site deployed at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed!"
