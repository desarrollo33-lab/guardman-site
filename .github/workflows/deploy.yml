name: Sync & Deploy Site

on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch:

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync from Admin API
        run: node scripts/sync-from-admin.mjs
        env:
          NODE_ENV: production

      - name: Validate CMS data
        run: node scripts/validate-cms.mjs
        continue-on-error: true

      - name: Build Astro Site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy dist --project-name=guardman-site-v2

      - name: Health Check
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://guardman-site-v2.pages.dev/ || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Health check returned $STATUS (may need more time)"
          else
            echo "✅ Health check passed - HTTP $STATUS"
          fi

      - name: Notify success
        if: success()
        run: echo "✅ Site deployed at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed!"
